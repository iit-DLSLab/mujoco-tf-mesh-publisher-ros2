name: mujoco_tf_mesh_publisher_ros2_env
# Force ROS 2 to use localhost at startup for safety.
# This value can still be overridden after activating the environment.
variables:
  ROS_LOCALHOST_ONLY: "1"
channels:
- conda-forge
- nvidia
- robostack-humble
dependencies:
- pip
- python
- numpy
- cuda-nvcc 
- ros-humble-desktop-full
- ros-humble-joint-state-publisher
- ros-humble-plotjuggler-ros
- ros-humble-rmw-cyclonedds-cpp
- ros-humble-rosidl-generator-dds-idl
- compilers 
- cmake 
- pkg-config 
- make 
- ninja 
- colcon-common-extensions 
- catkin_tools 
- rosdep
- tqdm